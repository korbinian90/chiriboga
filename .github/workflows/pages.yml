name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='*.php' \
            --exclude='.htaccess' \
            ./ _site/

      - name: Render PHP entry pages to HTML
        run: |
          for f in index engine decklauncher gauntlet; do
            php -f "${f}.php" > "_site/${f}.html"
          done

      - name: Rewrite cross-page navigation from .php to .html
        run: |
          find _site -type f \( -name '*.js' -o -name '*.html' \) -print0 \
            | xargs -0 sed -i \
                -e 's/index\.php/index.html/g' \
                -e 's/engine\.php/engine.html/g' \
                -e 's/decklauncher\.php/decklauncher.html/g' \
                -e 's/gauntlet\.php/gauntlet.html/g'

      # PWA manifest uses root-relative paths that break under a project-page
      # subpath (https://<user>.github.io/<repo>/). Rewrite to relative.
      - name: Fix manifest.json paths for project-page subpath
        run: |
          sed -i \
            -e 's|"src": "/|"src": "|g' \
            -e 's|"start_url": "/|"start_url": "|g' \
            -e 's|"scope": "/app/"|"scope": "./"|g' \
            _site/manifest.json

      # The IP shown in the menu was rendered server-side at build time, so
      # every visitor would see "Unknown". Swap in a placeholder updated by
      # client-side fetch, with a silent fallback if the lookup fails.
      - name: Replace build-time IP with client-side lookup
        run: |
          sed -i \
            's|<span class="status-item">IP: [^<]*</span>|<span class="status-item">IP: <span class="visitor-ip">--</span></span>|g' \
            _site/index.html
          cat >> _site/index.html <<'EOF'
          <script>
          fetch('https://api.ipify.org?format=json')
            .then(function(r){return r.json();})
            .then(function(d){document.querySelectorAll('.visitor-ip').forEach(function(e){e.textContent=d.ip;});})
            .catch(function(){});
          </script>
          EOF

      # When card images are not bundled (the default for this Pages deploy),
      # PIXI.Texture.fromImage 404s for every card art / counter PNG and the
      # engine's per-frame loading-texture ticker (cardrenderer.js) hangs at
      # "DECKBUILDING…" forever waiting for texture.valid===true. Patch
      # PIXI.Texture.fromImage right after pixi loads so errored textures are
      # marked valid, letting the engine proceed with empty placeholders.
      - name: Patch PIXI to tolerate missing card images
        run: |
          PATCH='<script>(function(){if(typeof PIXI==="undefined"||!PIXI.Texture||!PIXI.Texture.fromImage)return;var o=PIXI.Texture.fromImage;PIXI.Texture.fromImage=function(){var t=o.apply(this,arguments);if(t\&\&t.baseTexture)t.baseTexture.on("error",function(){t.valid=true;});return t;};})();</script>'
          for f in _site/engine.html _site/decklauncher.html _site/gauntlet.html; do
            # Use # as sed delimiter because PATCH contains || (JS logical-or)
            sed -i "s#<script src=\"cardrenderer/pixi.min.js[^\"]*\"></script>#&${PATCH}#" "$f"
          done

      # Register a Service Worker that caches card art from the NetrunnerDB
      # CDN (see sw.js). First view of each card hits the network; later
      # views are served from the browser Cache API.
      - name: Register Service Worker on entry pages
        run: |
          REG='<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}</script>'
          for f in _site/index.html _site/engine.html _site/decklauncher.html _site/gauntlet.html; do
            sed -i "s#</head>#${REG}</head>#" "$f"
          done

      # GitHub Pages cannot set custom HTTP headers, so the .htaccess CSP /
      # Referrer-Policy are re-established via <meta> equivalents. Headers that
      # cannot be set via meta (X-Frame-Options, X-Content-Type-Options,
      # Permissions-Policy, HSTS) cannot be replicated on Pages.
      - name: Inject security <meta> tags
        run: |
          META='  <meta http-equiv="Content-Security-Policy" content="default-src '"'"'self'"'"'; img-src '"'"'self'"'"' data: https://card-images.netrunnerdb.com; script-src '"'"'self'"'"' '"'"'unsafe-inline'"'"' '"'"'unsafe-eval'"'"' https://www.googletagmanager.com; style-src '"'"'self'"'"' '"'"'unsafe-inline'"'"'; font-src '"'"'self'"'"' data:; connect-src '"'"'self'"'"' https://api.ipify.org https://card-images.netrunnerdb.com https://www.google-analytics.com https://analytics.google.com; object-src '"'"'none'"'"'">\n  <meta name="referrer" content="strict-origin-when-cross-origin">'
          for f in _site/index.html _site/engine.html _site/decklauncher.html _site/gauntlet.html; do
            # Case-insensitive match (charset value is "UTF-8" in index.php, "utf-8" in the others)
            sed -i "s|<meta charset=\"utf-8\">|&\n${META}|I" "$f"
          done

      # Existing bookmarks / shared URLs use .php paths (e.g. gauntlet.php?r=...).
      # GitHub Pages serves 404.html on any unknown path; this stub detects
      # legacy .php URLs and redirects to the .html equivalent in-browser,
      # preserving query string and hash.
      - name: Generate 404.html that redirects legacy .php URLs
        run: |
          cat > _site/404.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>Redirecting…</title>
            <script>
            (function () {
              var p = location.pathname;
              var redirected = p.replace(/\.php$/, '.html');
              if (redirected !== p) {
                location.replace(redirected + location.search + location.hash);
              }
            })();
            </script>
          </head>
          <body>404 — Page not found.</body>
          </html>
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
