name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='*.php' \
            --exclude='.htaccess' \
            ./ _site/

      - name: Render PHP entry pages to HTML
        run: |
          for f in index engine decklauncher gauntlet; do
            php -f "${f}.php" > "_site/${f}.html"
          done

      - name: Rewrite cross-page navigation from .php to .html
        run: |
          find _site -type f \( -name '*.js' -o -name '*.html' \) -print0 \
            | xargs -0 sed -i \
                -e 's/index\.php/index.html/g' \
                -e 's/engine\.php/engine.html/g' \
                -e 's/decklauncher\.php/decklauncher.html/g' \
                -e 's/gauntlet\.php/gauntlet.html/g'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
